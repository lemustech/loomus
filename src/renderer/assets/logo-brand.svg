<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <defs>
    <linearGradient id="lumosChroma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <radialGradient id="lumosGlowBrand" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <filter id="spellGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Wand & Starburst Icon Emblem on the left -->
  <g transform="translate(4, 4) scale(0.11)">
    <!-- Squircle frame -->
    <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="#0b0e17" stroke="rgba(255,255,255,0.14)" stroke-width="8"/>
    
    <!-- Shockwave ring -->
    <circle cx="320" cy="180" r="140" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="4" stroke-dasharray="10 12" />

    <!-- Wand -->
    <path d="M 120 390 L 136 374 L 316 186 L 310 180 Z" fill="#78716c" filter="url(#spellGlow)" />
    <path d="M 130 380 Q 200 310 314 184" fill="none" stroke="url(#lumosChroma)" stroke-width="8" stroke-linecap="round" />

    <!-- Starburst Flares -->
    <path d="M 120 180 L 520 180 L 320 188 L 320 172 Z" fill="url(#lumosGlowBrand)" />
    <path d="M 320 0 L 320 360 L 312 180 L 328 180 Z" fill="url(#lumosGlowBrand)" />
    <g transform="rotate(45 320 180)">
      <path d="M 180 180 L 460 180 L 320 186 L 320 174 Z" fill="url(#lumosGlowBrand)" opacity="0.7" />
      <path d="M 320 60 L 320 300 L 314 180 L 326 180 Z" fill="url(#lumosGlowBrand)" opacity="0.7" />
    </g>

    <!-- Core Orb -->
    <circle cx="320" cy="180" r="32" fill="#ffffff" filter="url(#spellGlow)" />
    <circle cx="320" cy="180" r="12" fill="#0b0e17" stroke="#ffffff" stroke-width="4" />
    <circle cx="320" cy="180" r="6" fill="#f43f5e" />

    <!-- Stardust Stars -->
    <path d="M 390 120 Q 390 135 405 135 Q 390 135 390 150 Q 390 135 375 135 Q 390 135 390 120 Z" fill="#ffffff" />
    <path d="M 230 110 Q 230 120 240 120 Q 230 120 230 130 Q 230 120 220 120 Q 230 120 230 110 Z" fill="#fde047" />
  </g>

  <!-- Typography: LOOMUS -->
  <text x="76" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'SF Pro Display', sans-serif" font-size="28" font-weight="800" letter-spacing="1.2" fill="#ffffff">
    LOOM<tspan fill="url(#lumosChroma)">US</tspan>
  </text>
  
  <!-- Lumos Maxima / Pro Badge -->
  <rect x="226" y="23" width="76" height="20" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" />
  <text x="264" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.8">MAXIMA</text>
</svg>
