<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Nebula Background -->
    <radialGradient id="spaceGlow" cx="60%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1e183a" />
      <stop offset="45%" stop-color="#0f1122" />
      <stop offset="100%" stop-color="#06070c" />
    </radialGradient>

    <!-- Lumos Maxima Light Core Gradient -->
    <radialGradient id="lumosCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e0f2fe" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Starlight Golden Flare -->
    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Magic Wand Gradient (Elder Wand / Dark Polished Wood with Lumos Glow) -->
    <linearGradient id="wandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="35%" stop-color="#292524" />
      <stop offset="70%" stop-color="#44403c" />
      <stop offset="90%" stop-color="#78716c" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Wand Energy Core Channel (Lumos Rune Inscription) -->
    <linearGradient id="energyChannel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Star Flare Diamond Gradients -->
    <linearGradient id="flareH" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="flareV" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glass Specular Arc -->
    <linearGradient id="appleGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- High-Intensity Magic Glow Filter -->
    <filter id="lumosGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur1" />
      <feGaussianBlur stdDeviation="36" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Squircle App Icon Container (macOS Style) -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#spaceGlow)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="3" filter="url(#dropGlow)" />

  <!-- Ambient Magical Mist / Cosmic Nebulae -->
  <circle cx="320" cy="180" r="170" fill="url(#lumosCore)" opacity="0.4" filter="blur(45px)" />
  <circle cx="320" cy="180" r="90" fill="url(#goldAura)" opacity="0.6" filter="blur(25px)" />

  <!-- Concentric Spell Wave Rings (Lumos Maxima Shockwave) -->
  <circle cx="320" cy="180" r="140" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="320" cy="180" r="190" fill="none" stroke="rgba(192, 132, 252, 0.18)" stroke-width="1.5" stroke-dasharray="3 12" />

  <!-- THE MAGIC WAND (Forms an iconic dynamic 'L' angle pointing towards top-right) -->
  <g id="magicWand">
    <!-- Wand Handle / Grip Pommel -->
    <ellipse cx="125" cy="385" rx="14" ry="10" transform="rotate(-40 125 385)" fill="#1c1917" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    
    <!-- Wand Shaft tapering to the tip -->
    <!-- From x1: 125, y1: 385 to Tip x2: 310, y2: 190 -->
    <path d="M 115 395 
             L 132 378 
             L 316 186 
             L 312 182 
             Z" 
          fill="url(#wandGrad)" 
          filter="drop-shadow(0 10px 15px rgba(0,0,0,0.8))" />

    <!-- Elder Wand Segment Rings / Knots -->
    <ellipse cx="160" cy="346" rx="8" ry="5" transform="rotate(-42 160 346)" fill="#292524" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <ellipse cx="205" cy="298" rx="7" ry="4.5" transform="rotate(-42 205 298)" fill="#292524" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <ellipse cx="255" cy="246" rx="6" ry="4" transform="rotate(-42 255 246)" fill="#292524" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

    <!-- Wand Glowing Rune Filament (Magical Channel) -->
    <path d="M 130 380 Q 200 310 314 184" 
          fill="none" 
          stroke="url(#energyChannel)" 
          stroke-width="3" 
          stroke-linecap="round" 
          filter="drop-shadow(0 0 8px #a855f7)" />
  </g>

  <!-- LUMOS MAXIMA: CELESTIAL STARBURST & FLARES -->
  <g id="lumosSpell" filter="url(#lumosGlow)">
    
    <!-- Primary Major Horizontal Flare Beam -->
    <path d="M 130 180 L 510 180 L 320 186 L 320 174 Z" fill="url(#flareH)" opacity="0.9" />
    
    <!-- Primary Major Vertical Flare Beam -->
    <path d="M 320 0 L 320 370 L 314 180 L 326 180 Z" fill="url(#flareV)" opacity="0.9" />

    <!-- Diagonal Secondary Spikes (45 degrees) -->
    <g transform="rotate(45 320 180)">
      <path d="M 180 180 L 460 180 L 320 184 L 320 176 Z" fill="url(#flareH)" opacity="0.65" />
      <path d="M 320 50 L 320 310 L 316 180 L 324 180 Z" fill="url(#flareV)" opacity="0.65" />
    </g>

    <!-- Brilliant Lumos Spark Core Orb -->
    <circle cx="320" cy="180" r="38" fill="url(#goldAura)" />
    <circle cx="320" cy="180" r="24" fill="url(#lumosCore)" />
    <circle cx="320" cy="180" r="14" fill="#ffffff" />

    <!-- Central Recording Lens Jewel (Loomus Eye inside Lumos Maxima) -->
    <circle cx="320" cy="180" r="8" fill="#0f1122" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="320" cy="180" r="4" fill="#f43f5e" filter="drop-shadow(0 0 6px #f43f5e)" />

    <!-- Sparkling Magical Stars / Stardust Particles -->
    <!-- Star 1 Top Right -->
    <path d="M 390 120 Q 390 135 405 135 Q 390 135 390 150 Q 390 135 375 135 Q 390 135 390 120 Z" fill="#ffffff" filter="drop-shadow(0 0 6px #38bdf8)" />
    <!-- Star 2 Top Left -->
    <path d="M 230 110 Q 230 120 240 120 Q 230 120 230 130 Q 230 120 220 120 Q 230 120 230 110 Z" fill="#fde047" filter="drop-shadow(0 0 5px #fde047)" />
    <!-- Star 3 Bottom Right -->
    <path d="M 410 240 Q 410 248 418 248 Q 410 248 410 256 Q 410 248 402 248 Q 410 248 410 240 Z" fill="#c084fc" filter="drop-shadow(0 0 5px #c084fc)" />
    <!-- Star 4 Mid Left -->
    <path d="M 180 220 Q 180 225 185 225 Q 180 225 180 230 Q 180 225 175 225 Q 180 225 180 220 Z" fill="#ffffff" />
    <!-- Star 5 Wand Spark -->
    <circle cx="280" cy="210" r="3" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />
    <circle cx="355" cy="225" r="2.5" fill="#fde047" />
    <circle cx="340" cy="130" r="3" fill="#38bdf8" />
  </g>

  <!-- Glass Specular Highlight (Apple macOS Sheen) -->
  <path d="M 28 132 C 28 72, 72 28, 132 28 L 380 28 C 440 28, 484 72, 484 132 C 340 160, 160 210, 28 132 Z" 
        fill="url(#appleGlass)" />
</svg>
