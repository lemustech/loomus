<svg width="640" height="420" viewBox="0 0 640 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado oscuro luxury -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="640" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>

    <linearGradient id="neonArrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="160" cy="225" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="480" cy="225" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rectángulo base -->
  <rect width="640" height="420" fill="url(#bgGrad)" />

  <!-- Efectos de luz ambiental detrás de los íconos -->
  <circle cx="160" cy="225" r="140" fill="url(#glowLeft)" />
  <circle cx="480" cy="225" r="140" fill="url(#glowRight)" />

  <!-- Cuadros sutiles donde se posicionan los íconos -->
  <rect x="95" y="155" width="130" height="130" rx="24" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="6 6" />
  <rect x="415" y="155" width="130" height="130" rx="24" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Cabecera: Marca Loomus Studio -->
  <g transform="translate(320, 55)" text-anchor="middle">
    <!-- Logotipo Loomus Studio reducido -->
    <circle cx="-115" cy="-2" r="16" fill="#a855f7" fill-opacity="0.2" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="-115" cy="-2" r="6" fill="#00f0ff" />
    
    <text x="15" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Loomus <tspan fill="#00f0ff">Studio</tspan>
    </text>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#94a3b8">
      Arrastra el ícono a la carpeta Aplicaciones para instalar
    </text>
  </g>

  <!-- Flecha Neón de Guía Central -->
  <g filter="url(#neonBlur)">
    <!-- Línea con flecha -->
    <path d="M 260 220 L 370 220" stroke="url(#neonArrow)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 360 210 L 375 220 L 360 230" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Texto de arrastre bajo la flecha -->
  <text x="320" y="246" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.5">
    ARRASTRAR
  </text>

  <!-- Pie de página con credenciales de privacidad -->
  <g transform="translate(320, 385)" text-anchor="middle">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#475569">
      100% Local-First • Sin Nube • Rendimiento Nativo Apple Silicon (arm64)
    </text>
  </g>
</svg>
